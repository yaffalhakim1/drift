# Runs the tests on every push to main and every pull request. The Go module
# is in desktop/, so every step runs there.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run of the older one.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
