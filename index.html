<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>drift — lo-fi radio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23e7b87e' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e7b87e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script>
  /* Resolve the theme before first paint so no flash of the wrong palette. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("drift-theme"); } catch (e) { /* storage blocked */ }
    var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    var theme = saved === "light" || saved === "dark" ? saved : system;
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelector('meta[name="theme-color"]').setAttribute(
      "content", theme === "light" ? "#f1ece3" : "#08080a"
    );
  })();
</script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<main class="stage">
  <div class="shell">

    <header class="topbar">
      <span class="wordmark">drift</span>
      <div class="topbar-right">
        <span class="tagline">lo-fi, synthesized live</span>
        <button class="theme" id="theme" type="button" aria-label="Switch to light theme" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"
                  stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <article class="card" aria-label="Lo-fi player">

      <section class="player">
        <div class="plate" id="plate"></div>

        <div class="meta" id="meta">
          <p class="kicker"><span class="pulse" id="pulse" aria-hidden="true"></span>now playing</p>
          <h1 class="title" id="title">Snowman</h1>
          <p class="subtitle" id="subtitle">WYS</p>
        </div>

        <div class="seek" id="seek">
          <div class="seek-rail">
            <div class="seek-fill" id="seekFill"></div>
          </div>
          <div class="seek-knob" id="seekKnob"></div>
          <input class="seek-input" id="seekInput" type="range" min="0" max="1000" value="0" step="1"
                 aria-label="Seek within track" aria-valuetext="0:00">
          <div class="times">
            <span id="timeNow">0:00</span>
            <span id="timeLeft" class="dim">−1:44</span>
          </div>
        </div>

        <div class="transport">
          <div class="transport-side"></div>

          <div class="cluster">
            <button class="btn ghost" id="prev" type="button" aria-label="Previous track">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.6 5.6 9 12l9.6 6.4z" fill="currentColor"/>
                <path d="M6.2 5.4v13.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>

            <button class="btn play" id="play" type="button" aria-label="Play">
              <span class="icon-play" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M8.6 5.1 19 12 8.6 18.9z" fill="currentColor"/></svg>
              </span>
              <span class="icon-pause" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="7.8" y="5" width="3.3" height="14" rx="1.65" fill="currentColor"/>
                  <rect x="12.9" y="5" width="3.3" height="14" rx="1.65" fill="currentColor"/>
                </svg>
              </span>
            </button>

            <button class="btn ghost" id="next" type="button" aria-label="Next track">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5.4 5.6 15 12l-9.6 6.4z" fill="currentColor"/>
                <path d="M17.8 5.4v13.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
          </div>

          <div class="transport-side end">
            <label class="vol" title="Volume">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.4h3.1L11.4 6v12L7.1 14.6H4z" fill="currentColor"/>
                <path d="M15.2 9.2a4 4 0 0 1 0 5.6" stroke="currentColor" stroke-width="1.6"
                      stroke-linecap="round" fill="none"/>
                <path d="M17.6 6.8a7.4 7.4 0 0 1 0 10.4" stroke="currentColor" stroke-width="1.6"
                      stroke-linecap="round" fill="none" opacity=".45"/>
              </svg>
              <input class="vol-input" id="vol" type="range" min="0" max="100" value="80" step="1"
                     aria-label="Volume">
            </label>
          </div>
        </div>
      </section>

      <section class="queue" aria-labelledby="queueHead">
        <h2 class="queue-head" id="queueHead">tracklist</h2>
        <ol class="queue-list" id="queueList"></ol>
      </section>

    </article>

  </div>
</main>

<script src="src/mix.js" defer></script>
<script src="src/tracks.js" defer></script>
<script src="src/engine.js" defer></script>
<script src="src/plate.js" defer></script>
<script src="src/theme.js" defer></script>
<script src="src/player.js" defer></script>
</body>
</html>
